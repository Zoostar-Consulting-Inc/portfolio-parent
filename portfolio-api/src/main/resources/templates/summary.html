<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Summary</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" th:href="@{/favicon.ico}" type="image/x-icon">
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row mb-4">
      <div class="col">
        <h2 th:text="#{dashboard.title}">Portfolio Summary Dashboard</h2>
      </div>
      <div class="col-auto">
        <span class="badge bg-primary" th:text="'Welcome, ' + ${name}">Welcome, User</span>
      </div>
    </div>

    <!-- Search Form -->
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <form id="summaryForm" class="row g-3 align-items-center">
          <div class="col-auto">
            <label for="ticker" class="col-form-label fw-bold" th:text="#{ticker.label}">Ticker Symbol:</label>
          </div>
          <div class="col-auto">
            <input type="text" id="ticker" name="ticker" class="form-control" th:placeholder="#{ticker.placeholder}">
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary" th:text="#{fetch.button}">Fetch Summary</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Alert / Status Message -->
    <div id="alertContainer"></div>

    <!-- Data Table -->
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th th:text="#{table.ticker}">Ticker</th>
                <th th:text="#{table.quantity}">Quantity</th>
                <th th:text="#{table.amount}">Amount ($)</th>
                <th th:text="#{table.cost}">Cost ($)</th>
              </tr>
            </thead>
            <tbody id="summaryTableBody">
              <tr>
                <td colspan="4" class="text-center text-muted">No data loaded yet. Click "Fetch Summary" to load positions.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript -->
  <script th:inline="javascript">
    const API_BASE_URL = /*[[${apiBaseUrl}]]*/ 'http://localhost:9080/portfolio-api';

    document.getElementById('summaryForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      
      const tickerInput = document.getElementById('ticker').value.trim();
      const tableBody = document.getElementById('summaryTableBody');
      const alertContainer = document.getElementById('alertContainer');

      // Clear previous alerts
      alertContainer.innerHTML = '';
      tableBody.innerHTML = `<tr><td colspan="4" class="text-center"><div class="spinner-border text-primary" role="status"></div> Loading...</td></tr>`;

      // Build query URL
      let url = `${API_BASE_URL}/summary`;
      if (tickerInput) {
        url += `?ticker=${encodeURIComponent(tickerInput)}`;
      }

      try {
        const response = await fetch(url, {
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Server returned status: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        renderTable(data.positions);

      } catch (error) {
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Failed to load data.</td></tr>`;
        alertContainer.innerHTML = `
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            <strong>Error:</strong> ${error.message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        `;
      }
    });

    function renderTable(positions) {
      const tableBody = document.getElementById('summaryTableBody');
      tableBody.innerHTML = '';

      if (!positions || Object.keys(positions).length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="text-center text-muted">No positions found.</td></tr>`;
        return;
      }

      // Iterate through the positions JSON object map
      for (const [tickerKey, details] of Object.entries(positions)) {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td class="fw-bold">${tickerKey}</td>
          <td>${details.quantity ?? 0}</td>
          <td>$${Number(details.amount ?? 0).toFixed(2)}</td>
          <td>$${Number(details.cost ?? 0).toFixed(2)}</td>
        `;

        tableBody.appendChild(row);
      }
    }
  </script>

  <!-- Bootstrap JS (for alert dismissals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
