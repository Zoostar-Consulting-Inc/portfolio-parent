build:
  name: '@build.number@'
  version: '@project.version@'
  timestamp: '@build.timestamp@'

logging:
  file:
    name: "logs/@project.build.finalName@.log"
  logback:
    rollingpolicy:
      file-name-pattern: "logs/archive/@project.build.finalName@-%d{yyyy-MM-dd}.%i.log.zip"
      max-history: 10
  
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 2048
  servlet:
    context-path: '/@project.build.finalName@'

spring:
  output:
    ansi:
      enabled: always
  profiles:
    active:
      - local # default spring boot profile

springdoc:
  show-actuator: true