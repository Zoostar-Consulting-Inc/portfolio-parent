logging:
  level:
    root: info
    '[com.zoostarinc]': trace
    '[net.zoostar]': trace

server:
  port: 6080

spring:
  datasource:
    url: jdbc:h2:mem:portfolio;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: ${user.name}
    password: S3cret$
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
