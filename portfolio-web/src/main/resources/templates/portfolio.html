<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container py-5">
    <h2 class="fw-bold mb-4">Portfolio Dashboard</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Ticker</th>
                            <th>Qty</th>
                            <th>Amount</th>
                            <th>Avg Cost</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="position : ${response.positions}">
                            <td class="fw-bold text-uppercase" th:text="${position.ticker}">AAPL</td>
                            <td th:text="${position.quantity}">0</td>
                            <td th:text="${#numbers.formatCurrency(position.amount)}">$0.00</td>
                            <td th:text="${#numbers.formatCurrency(position.cost)}">$0.00</td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(response)}">
                            <td colspan="4" class="text-center py-3 text-muted">No position data available.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
